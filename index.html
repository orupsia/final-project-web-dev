<!DOCTYPE html>
<html>
<head>
  <title>Web Dev Final Project</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h2>Sunny Angel!</h2>

    <div class="controls">
      <input type="text" id="location" placeholder="enter a place...">
      <button onclick="getWeather()">check weather</button>
      <button onclick="stopSound()">stop sound</button>
    </div>

    <p id="info">Search for a location to hear the weather 🎧</p>

    <img id="resultImage"/>

    <!-- Background upload -->
    <div class="upload">
      <label>Upload Background:</label>
      <input type="file" id="bgUpload" accept="image/*">
    </div>

    <!-- Decorations -->
    <div class="decorations">
      <img src="images/smiski1.png" class="decor float">
      <img src="images/sonnyangel1.png" class="decor spin">
      <img src="images/smiski2.png" class="decor">
      <img src="images/sonnyangel2.png" class="decor">
      <img src="images/smiski3.png" class="decor">
      <img src="images/sonnyangel3.jpg" class="decor">
      <img src="images/smiski4.png" class="decor">
      <img src="images/smiski5.png" class="decor">
      <img src="images/sonnyangel4.jpg" class="decor">
      <img src="images/smiski6.jpg" class="decor">
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
